# Render blueprint for the Alpha 6 OPS account server (free tier, testing phase).
# Database: a Neon PostgreSQL project; paste its pooled connection string into ConnectionStrings__Accounts.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: alpha6ops
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./src/Alpha6Ops.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__BehindProxy
        value: "true"
      # Host filtering admits RENDER_EXTERNAL_HOSTNAME automatically; custom domains are listed here.
      - key: Hosting__PublicHosts
        value: app.s4ops.com
      # Cloudflare proxies app.s4ops.com: rate limits key on CF-Connecting-IP, honoured only from Cloudflare ranges.
      - key: Hosting__TrustCloudflare
        value: "true"
      - key: Auth0__Authority
        value: https://dev-2m805d64kx5233sh.us.auth0.com/
      - key: Auth0__Audience
        value: https://api.alpha6ops.dev
      - key: Auth0__ClientId
        sync: false
      - key: Auth0__ClientSecret
        sync: false
      # Optional: a machine-to-machine client with only delete:users, so account deletion also removes the sign-in.
      - key: Auth0__ManagementClientId
        sync: false
      - key: Auth0__ManagementClientSecret
        sync: false
      - key: ConnectionStrings__Accounts
        sync: false
      - key: DataProtection__CertificateBase64
        sync: false
      - key: DataProtection__CertificatePassword
        sync: false
      - key: Release__DownloadUrl
        sync: false
      - key: Release__Version
        sync: false
      - key: Release__Sha256
        sync: false
      # Staff who may read problem reports and invite testers (/Staff/Feedback, /Staff/Testers), semicolon separated.
      - key: Staff__Emails
        sync: false
      # Public contact email for Privacy, Terms, Help and Download. Until set, pages name "the team member who invited you".
      - key: Legal__Contact
        sync: false
      # Optional Resend key: turns on invitation, reply and staff alert emails.
      - key: Email__ResendApiKey
        sync: false
      # Optional Cloudflare Turnstile keys for the public invitation request form.
      - key: Turnstile__SiteKey
        sync: false
      - key: Turnstile__SecretKey
        sync: false
      # Optional private R2 bucket for staff-only desktop builds (/Staff/Builds). Use an R2 token scoped to that bucket.
      - key: PreviewBuilds__AccountId
        sync: false
      - key: PreviewBuilds__Bucket
        sync: false
      - key: PreviewBuilds__AccessKeyId
        sync: false
      - key: PreviewBuilds__SecretAccessKey
        sync: false
